<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>群英志 · 微信小游戏</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at center, #3b1d0e 0%, #140a05 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .game-frame {
      position: relative;
      width: min(98vw, 1120px);
      max-height: 96vh;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.85), 0 0 0 3px #a16207;
      background: #1b140d;
    }
    @media (max-width: 900px) {
      .game-frame { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }
    }
    #gameCanvas {
      width: 100%; height: 100%; display: block; touch-action: none;
    }
  </style>
</head>
<body>
  <div class="game-frame">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    (function () {
      var isDev = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
      var ver = isDev ? ('124_' + Date.now()) : '124';
      var scripts = [
        'src/platform.js',
        'src/audio.js',
        'src/crypto.js',
        'src/api.js',
        'src/config.js',
        'src/assets.js',
        'src/state/gameState.js',
        'src/ui/drawUtils.js',
        'src/ui/compliance.js',
        'src/ui/portraits.js',
        'src/ui/skillVfx.js',
        'src/ui/sprites.js',
        'src/engine/battleEngine.js',
        'src/scenes/nameScene.js',
        'src/scenes/factionScene.js',
        'src/scenes/mapScene.js',
        'src/scenes/battleScene.js',
        'src/scenes/rosterScene.js',
        'src/scenes/warehouseScene.js',
        'src/scenes/beastDungeonScene.js',
        'src/scenes/arenaScene.js',
        'src/scenes/beastScene.js',
        'src/scenes/activityScene.js',
        'src/scenes/wheelScene.js',
        'src/scenes/shopScene.js',
        'src/scenes/ingotShopScene.js',
        'src/scenes/mailScene.js',
        'src/scenes/forgeScene.js',
        'src/scenes/demonScene.js',
        'src/scenes/campScene.js',
        'src/scenes/towerScene.js',
        'src/scenes/challengeScene.js',
        'src/scenes/marketScene.js',
        'src/scenes/hireScene.js',
        'src/scenes/rankScene.js',
        'src/scenes/worldBossScene.js',
        'src/scenes/guildScene.js',
        'src/scenes/inviteScene.js',
        'src/scenes/settingsScene.js',
        'src/main.js'
      ];
      for (var i = 0; i < scripts.length; i++) {
        document.write('<script src="' + scripts[i] + '?v=' + ver + '"><\/script>');
      }
    })();
  </script>
  <script>
    window.SiXiang.Main.start();
  </script>
</body>
</html>
